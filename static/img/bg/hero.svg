<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <title>A northern night: aurora, moon, mountains and pines</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="0.45" stop-color="#0d1418"/>
      <stop offset="0.78" stop-color="#2a1f14"/>
      <stop offset="1" stop-color="#3b2712"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fbf9a" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3fbf9a" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#7fd6b0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fdac00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e7c8"/>
      <stop offset="0.55" stop-color="#e9d2a2"/>
      <stop offset="1" stop-color="#e9d2a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#fdac00" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fdac00" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <symbol id="pine" viewBox="0 0 20 60">
      <path d="M10 0 L13 12 L11 12 L16 26 L12 26 L19 42 L12 42 L12 60 L8 60 L8 42 L1 42 L8 26 L4 26 L9 12 L7 12 Z"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#f8f2f0">
    <circle cx="120" cy="80" r="1.2" opacity="0.7"/><circle cx="260" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="410" cy="60" r="1.4" opacity="0.8"/><circle cx="530" cy="190" r="0.8" opacity="0.4"/>
    <circle cx="690" cy="110" r="1.1" opacity="0.6"/><circle cx="860" cy="40" r="0.9" opacity="0.5"/>
    <circle cx="980" cy="170" r="1.3" opacity="0.7"/><circle cx="1120" cy="90" r="0.8" opacity="0.5"/>
    <circle cx="1270" cy="210" r="1.2" opacity="0.6"/><circle cx="1420" cy="70" r="1" opacity="0.6"/>
    <circle cx="1530" cy="160" r="1.3" opacity="0.7"/><circle cx="60" cy="230" r="0.9" opacity="0.4"/>
    <circle cx="330" cy="260" r="1" opacity="0.4"/><circle cx="760" cy="250" r="0.8" opacity="0.35"/>
    <circle cx="1180" cy="280" r="0.9" opacity="0.35"/><circle cx="1480" cy="300" r="1" opacity="0.35"/>
  </g>

  <!-- Aurora -->
  <g filter="url(#blur)">
    <path d="M-50 260 C 250 120, 520 330, 820 200 S 1350 90, 1700 230 L1700 300 C 1350 170, 1100 320, 820 280 S 260 220, -50 340 Z" fill="url(#aurora)"/>
    <path d="M100 180 C 400 60, 700 230, 1000 140 S 1450 60, 1650 150 L1650 190 C 1450 110, 1200 240, 1000 200 S 400 120, 100 230 Z" fill="url(#aurora)" opacity="0.7"/>
  </g>

  <!-- Moon -->
  <circle cx="1240" cy="190" r="120" fill="url(#moon)" opacity="0.18"/>
  <circle cx="1240" cy="190" r="44" fill="#efdcb4" opacity="0.85"/>
  <circle cx="1226" cy="178" r="7" fill="#d9c08f" opacity="0.6"/>
  <circle cx="1254" cy="204" r="5" fill="#d9c08f" opacity="0.5"/>

  <!-- Warm horizon -->
  <rect y="420" width="1600" height="480" fill="url(#glow)"/>

  <!-- Far mountains -->
  <path d="M0 620 L120 520 L210 570 L330 450 L440 540 L560 470 L700 560 L820 430 L930 520 L1060 460 L1180 540 L1300 470 L1440 550 L1600 480 L1600 900 L0 900 Z" fill="#26323a"/>
  <!-- Snow caps -->
  <path d="M330 450 L352 468 L340 470 L330 462 L318 472 L308 470 Z M820 430 L846 452 L832 454 L820 446 L806 456 L796 452 Z M1060 460 L1080 476 L1068 478 L1060 470 L1050 480 L1040 476 Z" fill="#c9d3d6" opacity="0.35"/>

  <!-- Near ridge -->
  <path d="M0 700 L150 640 L260 680 L400 610 L520 670 L660 630 L780 690 L900 640 L1040 700 L1160 650 L1300 700 L1440 660 L1600 700 L1600 900 L0 900 Z" fill="#161d21"/>

  <!-- Pine line -->
  <g fill="#0a0d0f">
    <use href="#pine" x="20" y="660" width="26" height="78"/><use href="#pine" x="50" y="672" width="20" height="62"/>
    <use href="#pine" x="80" y="650" width="30" height="90"/><use href="#pine" x="230" y="680" width="22" height="66"/>
    <use href="#pine" x="260" y="664" width="28" height="84"/><use href="#pine" x="480" y="676" width="24" height="72"/>
    <use href="#pine" x="1100" y="668" width="26" height="80"/><use href="#pine" x="1130" y="680" width="20" height="60"/>
    <use href="#pine" x="1380" y="660" width="30" height="90"/><use href="#pine" x="1415" y="676" width="22" height="66"/>
    <use href="#pine" x="1520" y="664" width="28" height="84"/><use href="#pine" x="1555" y="678" width="20" height="62"/>
  </g>
  <path d="M0 760 L1600 760 L1600 900 L0 900 Z" fill="#0a0d0f"/>
  <path d="M0 740 Q 200 720 400 744 T 800 738 T 1200 746 T 1600 736 L1600 780 L0 780 Z" fill="#0a0d0f"/>
</svg>
