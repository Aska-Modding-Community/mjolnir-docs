<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <title>A carved stone circle of runes</title>
  <defs>
    <radialGradient id="light" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a2016"/>
      <stop offset="1" stop-color="#121110"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#light)"/>
  <g transform="translate(800 450)" fill="none" stroke="#fdac00" stroke-opacity="0.07" stroke-width="2">
    <circle r="380"/>
    <circle r="330"/>
    <circle r="200"/>
    <!-- Runes of the elder futhark round the ring -->
    <g stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(0) translate(0 -355)"><path d="M-6 -14 V14 M-6 -6 L6 -14 M-6 2 L6 -6"/></g>
      <g transform="rotate(30) translate(0 -355)"><path d="M-6 14 V-14 L6 -2 V14"/></g>
      <g transform="rotate(60) translate(0 -355)"><path d="M-6 -14 V14 M-6 -10 L6 -2 L-6 6"/></g>
      <g transform="rotate(90) translate(0 -355)"><path d="M0 -14 V14 M0 -10 L8 -2 M0 -2 L8 6"/></g>
      <g transform="rotate(120) translate(0 -355)"><path d="M-6 14 V-14 L6 -6 L-6 2 L6 14"/></g>
      <g transform="rotate(150) translate(0 -355)"><path d="M6 -14 L-6 0 L6 14"/></g>
      <g transform="rotate(180) translate(0 -355)"><path d="M-8 -14 L8 14 M8 -14 L-8 14"/></g>
      <g transform="rotate(210) translate(0 -355)"><path d="M-6 14 V-14 L6 -4 L-6 6"/></g>
      <g transform="rotate(240) translate(0 -355)"><path d="M-6 -14 V14 M6 -14 V14 M-6 -6 L6 6"/></g>
      <g transform="rotate(270) translate(0 -355)"><path d="M-6 -14 V14 M-6 -14 L6 -4"/></g>
      <g transform="rotate(300) translate(0 -355)"><path d="M0 -14 V14 M-8 -2 L0 6 L8 -2"/></g>
      <g transform="rotate(330) translate(0 -355)"><path d="M0 14 L0 -14 M-8 -14 L0 -6 L8 -14"/></g>
    </g>
    <!-- Eight staves from the middle -->
    <g stroke-width="2.5">
      <path d="M0 -200 V-120 M0 120 V200 M-200 0 H-120 M120 0 H200"/>
      <path d="M-141 -141 L-85 -85 M85 85 L141 141 M-141 141 L-85 85 M85 -85 L141 -141"/>
      <path d="M0 -150 L-14 -136 M0 -150 L14 -136 M0 150 L-14 136 M0 150 L14 136"/>
      <path d="M-150 0 L-136 -14 M-150 0 L-136 14 M150 0 L136 -14 M150 0 L136 14"/>
    </g>
    <circle r="60"/>
  </g>
</svg>
