<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
  <title>A fjord at dusk with a longhouse by the water</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121110"/>
      <stop offset="0.6" stop-color="#1a1611"/>
      <stop offset="1" stop-color="#2b2014"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdac00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fdac00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#dusk)"/>
  <path d="M0 420 L180 330 L300 380 L460 290 L600 360 L760 300 L900 380 L1060 310 L1200 370 L1360 300 L1500 350 L1600 320 L1600 600 L0 600 Z" fill="#191d1f" opacity="0.85"/>
  <path d="M0 470 L220 410 L380 450 L560 400 L740 460 L940 420 L1120 470 L1320 420 L1600 460 L1600 600 L0 600 Z" fill="#101315"/>
  <rect y="500" width="1600" height="100" fill="url(#water)"/>
  <!-- A longhouse with smoke and a warm doorway -->
  <g transform="translate(300 446)" fill="#0b0d0e">
    <path d="M0 40 L20 8 L120 8 L140 40 Z"/>
    <path d="M10 40 H130 V58 H10 Z"/>
    <path d="M14 8 L8 -4 M126 8 L132 -4" stroke="#0b0d0e" stroke-width="4"/>
  </g>
  <rect x="362" y="490" width="10" height="14" fill="#fdac00" opacity="0.55"/>
  <path d="M390 450 C 380 420, 410 410, 396 380 S 420 340, 408 310" fill="none" stroke="#c9b8a0" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round"/>
</svg>
